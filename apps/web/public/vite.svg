<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Stay logo</title>
  <desc id="desc">Simple circular badge with an S for the Stay app</desc>

  <defs>
    <!-- Soft gradient ring -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Dark circle background -->
  <circle cx="32" cy="32" r="28" fill="#020617" />

  <!-- Gradient ring -->
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="url(#ring)"
    stroke-width="4"
  />

  <!-- Centered S letter -->
  <!-- Slight shadow for better contrast at small size -->
  <text
    x="31.2"
    y="34"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="0.03em"
    fill="#020617"
    opacity="0.45"
  >
    S
  </text>

  <!-- Main S, centered and bold -->
  <text
    x="31.2"
    y="31.5"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
    font-weight="900"
    font-size="28"
    letter-spacing="0.03em"
    fill="#f9fafb"
  >
    S
  </text>
</svg>



